# Legacy Commands handled by tmux-sensible
# https://github.com/tmux-plugins/tmux-sensible
###########################################################################

set -g default-terminal "xterm-256color"

# https://github.com/tmux/tmux/issues/696
set-option -ga terminal-overrides ",xterm-256color:Tc"

set-option -g default-shell /opt/homebrew/bin/bash

set-window-option -g xterm-keys on

# Set ability to capture on start and restore on exit window data when
# running an application
setw -g alternate-screen on

# Keep current path.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# setup | and - for window splitting
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# title
set -g set-titles on
set -g set-titles-string '#T'
#set -g status-justify centre

# start window numbering at 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# default statusbar colors
# TMUX 2.9
set-option -g status-style fg=colour7,bg=colour0,default

# default window title colors
setw -g window-status-style 'fg=colour6 bg=default dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour1]#F '

set-window-option -g automatic-rename on

# active window title colors
setw -g window-status-current-style 'fg=colour1 bold'
setw -g window-status-current-format '| #I #W #F |'

# Status right
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'

# pane borders
set -g pane-border-style 'fg=colour1 dim'
set -g pane-active-border-style 'fg=colour3'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour1'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

# messages
set -g message-style 'fg=colour2 bg=colour0 bold'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'catppuccin/tmux'

set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
